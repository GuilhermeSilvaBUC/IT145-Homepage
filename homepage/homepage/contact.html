
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Guilherme Pereira</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Guilherme Pereira</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </div>
            <button id="theme-toggle" type="button">Dark Mode</button>
        </nav>
    </header>

    <main>
        <section class="content">
            <h1>Contact Me</h1>

            <p>
                Have a question or want to get in touch?
                Fill out the form below.
            </p>

            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Your email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message"
                          rows="5"
                          placeholder="Write your message"
                          required></textarea>

                <button type="submit" class="btn">
                    Send Message
                </button>
            </form>

            <p id="form-response" role="status"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Guilherme Pereira | IT145</p>
    </footer>
</body>
</html>
